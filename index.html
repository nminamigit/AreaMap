<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>訪問管理マップツール</title>
<style>
  :root {
    --panel-bg: rgba(255, 255, 255, 0.95);
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  #map {
    width: 100vw;
    height: 100vh;
  }

  #control-panel {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--panel-bg);
    padding: 8px;
    border-radius: 12px;
    box-shadow: var(--shadow);
  }

  .mode-group {
    display: flex;
    gap: 8px;
  }

  .ctrl-btn {
    width: 50px;
    height: 50px;
    border: 2px solid #d1d5db;
    border-radius: 10px;
    background: #ffffff;
    font-size: 24px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .ctrl-btn.active {
    background: #3b82f6;
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
  }

  .ctrl-btn:active {
    transform: scale(0.95);
  }

  .ctrl-btn.locked {
    background: #ef4444;
    border-color: #dc2626;
    color: #ffffff;
    box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.4);
  }

  #selection-layer {
    position: fixed;
    inset: 0;
    z-index: 15;
    display: none;
    touch-action: none;
    cursor: crosshair;
    background: rgba(59, 130, 246, 0.05);
  }
  #selection-rect {
    position: fixed;
    display: none;
    border: 2px dashed #2563eb;
    background: rgba(59, 130, 246, 0.15);
    pointer-events: none;
    z-index: 16;
  }
  #selection-hint {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 17;
    background: rgba(17, 24, 39, 0.85);
    color: #ffffff;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    pointer-events: none;
    white-space: nowrap;
  }

  .mode-group input[type="radio"] {
    display: none;
  }

  #legend {
    position: absolute;
    bottom: 20px;
    right: 12px;
    z-index: 20;
    background: var(--panel-bg);
    padding: 10px 12px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    font-size: 13px;
  }

  #legend .legend-title {
    font-weight: bold;
    margin-bottom: 6px;
    font-size: 12px;
    color: #374151;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 3px 0;
  }

  .legend-swatch {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 1px solid #9ca3af;
    flex: 0 0 auto;
  }

  .marker-wrap {
    width: 44px;
    height: 44px;
    transform: translateY(-6px);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  .marker-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
    pointer-events: none;
  }

  #context-menu {
    position: fixed;
    z-index: 40;
    min-width: 160px;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    padding: 6px;
    display: none;
  }

  .cm-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  .cm-item:active { background: #f3f4f6; }

  .cm-swatch {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1px solid #9ca3af;
    flex: 0 0 auto;
  }

  .cm-delete {
    color: #ef4444;
    font-weight: bold;
    border-top: 1px solid #e5e7eb;
    margin-top: 4px;
  }

  #room-modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
  }

  #room-modal {
    background: #ffffff;
    width: min(92vw, 640px);
    max-height: 88vh;
    border-radius: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .modal-header {
    padding: 12px 14px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .modal-header .title {
    font-weight: bold;
    font-size: 16px;
    flex: 1 1 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .tool-btn {
    border: 1px solid #d1d5db;
    background: #f9fafb;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .tool-btn:active { background: #e5e7eb; }
  .tool-btn.danger { color: #ef4444; border-color: #fca5a5; }

  #modal-close {
    border: none;
    background: transparent;
    font-size: 22px;
    cursor: pointer;
    color: #6b7280;
    padding: 0 4px;
  }

  .modal-body {
    padding: 14px;
    overflow: auto;
  }

  table.room-grid {
    border-collapse: separate;
    border-spacing: 6px;
    margin: 0 auto;
  }
  table.room-grid td {
    width: 60px;
    height: 44px;
    text-align: center;
    vertical-align: middle;
    border-radius: 8px;
    border: 1px solid #9ca3af;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  table.room-grid td.floor-label {
    border: none;
    background: transparent !important;
    color: #6b7280;
    font-weight: normal;
    font-size: 12px;
    cursor: default;
    width: 40px;
  }
</style>
</head>
<body>
  <div id="map"></div>

  <div id="control-panel">
    <div class="mode-group">
      <input type="radio" name="mode" id="mode-house" value="house" checked />
      <label class="ctrl-btn active" id="btn-house" for="mode-house" title="家モード">🏠</label>
      <input type="radio" name="mode" id="mode-building" value="building" />
      <label class="ctrl-btn" id="btn-building" for="mode-building" title="ビルモード">🏢</label>
    </div>
    <button class="ctrl-btn" id="btn-search" title="住所検索" style="width:108px;">🔍</button>
    <button class="ctrl-btn" id="btn-lock" title="編集ロック（タップでロック）" style="width:108px;">🔓</button>
    <button class="ctrl-btn" id="btn-select" title="範囲選択して未訪問に戻す" style="width:108px;font-size:14px;">▭ 範囲選択</button>
  </div>

  <div id="legend">
    <div class="legend-title">ステータス凡例</div>
    <div id="legend-list"></div>
  </div>

  <div id="context-menu"></div>

  <div id="selection-layer">
    <div id="selection-hint">ドラッグで範囲を選択 → まとめて未訪問に戻す（もう一度ボタンで解除）</div>
    <div id="selection-rect"></div>
  </div>

  <div id="room-modal-overlay">
    <div id="room-modal">
      <div class="modal-header">
        <div class="title">
          <span>アパート部屋管理</span>
          <button id="modal-close" aria-label="閉じる">✖</button>
        </div>
        <button class="tool-btn" data-action="addFloor">＋ 行追加 (上階)</button>
        <button class="tool-btn" data-action="addRoom">＋ 列追加 (部屋)</button>
        <button class="tool-btn" data-action="removeFloor">－ 行削除</button>
        <button class="tool-btn" data-action="removeRoom">－ 列削除</button>
        <button class="tool-btn danger" data-action="hide4">✖ 「4」を削除</button>
      </div>
      <div class="modal-body">
        <table class="room-grid" id="room-grid"></table>
      </div>
    </div>
  </div>

<script>
const STATUSES = [
  { label: "未訪問",       color: "#ffffff", font: "#1a1a1a" },
  { label: "訪問済み",     color: "#3b82f6", font: "#ffffff" },
  { label: "留守",         color: "#eab308", font: "#1a1a1a" },
  { label: "留守２回以上", color: "#f97316", font: "#ffffff" },
  { label: "訪問拒否",     color: "#ef4444", font: "#ffffff" },
  { label: "空家",         color: "#6b7280", font: "#ffffff" },
];
const STATUS_COUNT = STATUSES.length;
const BUILDING_COLOR = "#9ca3af";

const STORAGE_KEY = "ipad_map_markers_v5";
const LOCK_KEY = "ipad_map_locked_v1";
const LONG_PRESS_MS = 600;
const MOVE_THRESHOLD = 10;
const TOKYO_STATION = { lat: 35.681236, lng: 139.767125 };

let map;
let AdvancedMarkerElement;
let geocoder;
let currentMode = "house";
let markersData = [];
let markerObjects = {};
let longPressTimer = null;
let longPressFired = false;
let pointerStart = { x: 0, y: 0 };
let suppressNextMapClick = false;
let activeBuildingId = null;
let isLocked = false;
let selectionMode = false;
let overlayProjection = null;
let selStart = null;

function houseSVG(color) {
  const stroke = "#1a1a1a";
  return `
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2.2 1.5 11h3v10.5h6V15h3v6.5h6V11h3z"
            fill="${color}" stroke="${stroke}" stroke-width="1"
            stroke-linejoin="round"/>
    </svg>`;
}

function buildingSVG(color = BUILDING_COLOR) {
  const stroke = "#1a1a1a";
  return `
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 2h11v20H4zM15 8h5v14h-5z"
            fill="${color}" stroke="${stroke}" stroke-width="1"
            stroke-linejoin="round"/>
      <g fill="${stroke}">
        <rect x="6"  y="4"  width="2" height="2"/>
        <rect x="9"  y="4"  width="2" height="2"/>
        <rect x="6"  y="8"  width="2" height="2"/>
        <rect x="9"  y="8"  width="2" height="2"/>
        <rect x="6"  y="12" width="2" height="2"/>
        <rect x="9"  y="12" width="2" height="2"/>
        <rect x="6"  y="16" width="2" height="2"/>
        <rect x="9"  y="16" width="2" height="2"/>
        <rect x="16.5" y="11" width="1.6" height="1.6"/>
        <rect x="16.5" y="15" width="1.6" height="1.6"/>
      </g>
    </svg>`;
}

function getBuildingColor(data) {
  // オンライン区域の場合は最優先でオレンジ
  if (data.isOnlineArea) return "#f97316";

  const r = data.rooms;
  if (!r) return BUILDING_COLOR;

  let validRoomCount = 0;
  let hasUnvisited = false;
  let hasBlueOrYellow = false;

  for (let floor = 1; floor <= r.maxFloor; floor++) {
    for (let num = 1; num <= r.maxRoomNum; num++) {
      const roomNo = String(floor * 100 + num);
      if (r.hiddenRooms.includes(roomNo)) continue;
      
      validRoomCount++;
      const st = r.states[roomNo] || 0;
      if (st === 0) hasUnvisited = true; // 0: 未訪問
      if (st === 1 || st === 2) hasBlueOrYellow = true; // 1: 青(訪問済), 2: 黄(留守)
    }
  }

  // 優先順位に沿って色を判定
  if (validRoomCount <= 1) return "#9ca3af"; // グレー (101のみ等の初期状態)
  if (!hasUnvisited && validRoomCount > 0) return "#3b82f6"; // 青 (未訪問が1件もない時)
  if (hasBlueOrYellow) return "#eab308"; // 黄色 (1件でも青か黄がある時)
  return "#ffffff"; // 白 (2部屋以上で上記以外)
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(markersData));
  } catch (e) {
    console.error("保存失敗:", e);
  }
}

function loadLock() {
  try {
    return JSON.parse(localStorage.getItem(LOCK_KEY)) === true;
  } catch (e) {
    return false;
  }
}

function updateLockButton() {
  const btn = document.getElementById("btn-lock");
  if (!btn) return;
  btn.textContent = isLocked ? "🔒" : "🔓";
  btn.classList.toggle("locked", isLocked);
  btn.title = isLocked ? "編集ロック中（タップで解除）" : "編集ロック（タップでロック）";
}

function setLock(locked) {
  isLocked = locked;
  try {
    localStorage.setItem(LOCK_KEY, JSON.stringify(isLocked));
  } catch (e) {
    console.error("ロック状態の保存失敗:", e);
  }
  // 既存マーカーのドラッグ可否を一括反映
  Object.values(markerObjects).forEach(obj => { obj.gmarker.gmpDraggable = !isLocked; });
  updateLockButton();
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error("読込失敗:", e);
    return [];
  }
}

function renderLegend() {
  const list = document.getElementById("legend-list");
  list.innerHTML = STATUSES.map(s =>
    `<div class="legend-row">
       <span class="legend-swatch" style="background:${s.color}"></span>
       <span>${s.label}</span>
     </div>`
  ).join("");
}

async function initMap() {
  const { Map } = await google.maps.importLibrary("maps");
  const markerLib = await google.maps.importLibrary("marker");
  AdvancedMarkerElement = markerLib.AdvancedMarkerElement;
  await google.maps.importLibrary("geocoding");
  geocoder = new google.maps.Geocoder();

  map = new Map(document.getElementById("map"), {
    center: TOKYO_STATION,
    zoom: 16,
    disableDoubleClickZoom: true,
    disableDefaultUI: true,
    zoomControl: true,
    gestureHandling: "greedy",
    clickableIcons: false,
    mapId: "DEMO_MAP_ID",
  });

  map.addListener("click", (e) => {
    if (suppressNextMapClick) { suppressNextMapClick = false; return; }
    // マーカー長押し等の残余クリックではメニューを閉じない（ロック中でも維持）
    hideContextMenu();
    if (isLocked) return;
    addMarker(e.latLng.lat(), e.latLng.lng(), currentMode);
  });
  
  map.addListener("dragstart", hideContextMenu);
  initProjectionHelper();

  markersData = loadData();
  isLocked = loadLock();
  markersData.forEach(createMarkerObject);
  updateLockButton();

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        map.setCenter({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        map.setZoom(16);
      },
      () => {},
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }

  renderLegend();
}
window.initMap = initMap;

function defaultRooms() {
  return {
    maxFloor: 1,
    maxRoomNum: 1,
    states: { "101": 0 },
    hiddenRooms: [],
  };
}

function addMarker(lat, lng, type) {
  const data = {
    id: String(Date.now()),
    lat, lng,
    statusIndex: 0,
    type,
    rooms: type === "building" ? defaultRooms() : null,
    isOnlineArea: false // 新規追加フラグ
  };
  markersData.push(data);
  createMarkerObject(data);
  saveData();
}

function createMarkerObject(data) {
  const wrap = document.createElement("div");
  wrap.className = "marker-wrap";
  wrap.innerHTML = data.type === "house"
    ? houseSVG(STATUSES[data.statusIndex].color)
    : buildingSVG(getBuildingColor(data));

  const gmarker = new AdvancedMarkerElement({
    map,
    position: { lat: data.lat, lng: data.lng },
    content: wrap,
    gmpDraggable: !isLocked,
  });

  gmarker.addListener("dragstart", () => {
    clearLongPress();
    longPressFired = true; 
  });
  gmarker.addListener("dragend", () => {
    const p = gmarker.position;
    data.lat = (typeof p.lat === "function") ? p.lat() : p.lat;
    data.lng = (typeof p.lng === "function") ? p.lng() : p.lng;
    saveData();
    suppressNextMapClick = true;
    setTimeout(() => { suppressNextMapClick = false; }, 350);
  });

  attachPointerHandlers(wrap, {
    onTap: () => handleMarkerTap(data),
    onLongPress: (x, y) => handleMarkerLongPress(data, x, y),
  });

  markerObjects[data.id] = { data, gmarker, contentEl: wrap };
}

function refreshMarkerVisual(data) {
  const obj = markerObjects[data.id];
  if (!obj) return;
  obj.contentEl.innerHTML = data.type === "house"
    ? houseSVG(STATUSES[data.statusIndex].color)
    : buildingSVG(getBuildingColor(data));
}

function removeMarker(id) {
  const obj = markerObjects[id];
  if (obj) {
    obj.gmarker.map = null;
    delete markerObjects[id];
  }
  markersData = markersData.filter(m => m.id !== id);
  saveData();
}

function attachPointerHandlers(el, { onTap, onLongPress }) {
  el.addEventListener("pointerdown", (e) => {
    pointerStart = { x: e.clientX, y: e.clientY };
    longPressFired = false;
    clearLongPress();
    longPressTimer = setTimeout(() => {
      longPressFired = true;
      onLongPress(e.clientX, e.clientY);
    }, LONG_PRESS_MS);
  });

  el.addEventListener("pointermove", (e) => {
    const dx = Math.abs(e.clientX - pointerStart.x);
    const dy = Math.abs(e.clientY - pointerStart.y);
    if (dx > MOVE_THRESHOLD || dy > MOVE_THRESHOLD) {
      clearLongPress();
    }
  });

  el.addEventListener("pointerup", (e) => {
    clearLongPress();
    suppressNextMapClick = true;
    setTimeout(() => { suppressNextMapClick = false; }, 350);
    if (longPressFired) return;
    const dx = Math.abs(e.clientX - pointerStart.x);
    const dy = Math.abs(e.clientY - pointerStart.y);
    if (dx > MOVE_THRESHOLD || dy > MOVE_THRESHOLD) return;
    onTap();
  });

  el.addEventListener("pointercancel", () => {
    clearLongPress();
  });

  el.addEventListener("contextmenu", (e) => e.preventDefault());
}

function clearLongPress() {
  if (longPressTimer) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
}

function handleMarkerTap(data) {
  if (data.type === "house") {
    data.statusIndex = (data.statusIndex + 1) % STATUS_COUNT;
    refreshMarkerVisual(data);
    saveData();
  } else {
    openRoomModal(data);
  }
}

function handleMarkerLongPress(data, x, y) {
  const items = [];
  if (data.type === "house") {
    STATUSES.forEach((s, i) => {
      items.push({
        swatch: s.color,
        label: s.label,
        onClick: () => {
          data.statusIndex = i;
          refreshMarkerVisual(data);
          saveData();
        },
      });
    });
  } else if (data.type === "building") {
    // オンライン区域のトグル設定追加
    items.push({
      label: data.isOnlineArea ? "✅ オンライン区域" : "オンライン区域",
      onClick: () => {
        data.isOnlineArea = !data.isOnlineArea;
        refreshMarkerVisual(data);
        saveData();
      }
    });
  }

  items.push({
    delete: true,
    label: "アイコンを削除",
    onClick: () => removeMarker(data.id),
  });
  showContextMenu(x, y, items);
}

function showContextMenu(x, y, items) {
  const menu = document.getElementById("context-menu");
  menu.innerHTML = "";
  items.forEach(it => {
    const div = document.createElement("div");
    div.className = "cm-item" + (it.delete ? " cm-delete" : "");
    if (it.swatch) {
      div.innerHTML = `<span class="cm-swatch" style="background:${it.swatch}"></span><span>${it.label}</span>`;
    } else {
      div.innerHTML = `<span>${it.label}</span>`;
    }
    
    // バグ修正: メニュー操作時のイベント伝播を厳密に遮断
    div.addEventListener("pointerdown", (e) => e.stopPropagation());
    div.addEventListener("click", (e) => e.stopPropagation());
    div.addEventListener("pointerup", (e) => {
      e.stopPropagation();
      e.preventDefault();
      hideContextMenu();
      
      // マップ側での誤爆クリック防止フラグをセット
      suppressNextMapClick = true;
      setTimeout(() => { suppressNextMapClick = false; }, 350);

      it.onClick();
    });
    menu.appendChild(div);
  });

  menu.style.display = "block";
  menu.style.left = "0px";
  menu.style.top = "0px";
  const rect = menu.getBoundingClientRect();
  let left = x;
  let top = y;
  if (left + rect.width > window.innerWidth - 8) left = window.innerWidth - rect.width - 8;
  if (top + rect.height > window.innerHeight - 8) top = window.innerHeight - rect.height - 8;
  if (left < 8) left = 8;
  if (top < 8) top = 8;
  menu.style.left = left + "px";
  menu.style.top = top + "px";
}

function hideContextMenu() {
  const menu = document.getElementById("context-menu");
  menu.style.display = "none";
}

// ===== 範囲選択（一括未訪問化） =====
function initProjectionHelper() {
  const ov = new google.maps.OverlayView();
  ov.onAdd = function () {};
  ov.draw = function () { overlayProjection = this.getProjection(); };
  ov.onRemove = function () {};
  ov.setMap(map);
}

function enterSelectionMode() {
  selectionMode = true;
  hideContextMenu();
  document.getElementById("btn-select").classList.add("active");
  document.getElementById("selection-layer").style.display = "block";
  map.setOptions({ gestureHandling: "none", draggable: false });
}

function exitSelectionMode() {
  selectionMode = false;
  selStart = null;
  document.getElementById("btn-select").classList.remove("active");
  document.getElementById("selection-layer").style.display = "none";
  document.getElementById("selection-rect").style.display = "none";
  map.setOptions({ gestureHandling: "greedy", draggable: true });
}

function updateSelectionRect(x1, y1, x2, y2) {
  const rect = document.getElementById("selection-rect");
  rect.style.left = Math.min(x1, x2) + "px";
  rect.style.top = Math.min(y1, y2) + "px";
  rect.style.width = Math.abs(x2 - x1) + "px";
  rect.style.height = Math.abs(y2 - y1) + "px";
}

function resetMarkerToUnvisited(data) {
  if (data.type === "house") {
    data.statusIndex = 0;
  } else if (data.rooms) {
    Object.keys(data.rooms.states).forEach(k => { data.rooms.states[k] = 0; });
  }
  refreshMarkerVisual(data);
}

function finalizeSelection(a, b) {
  if (!overlayProjection) { exitSelectionMode(); return; }
  // 誤タップ相当（極端に小さい範囲）は無視
  if (Math.abs(a.x - b.x) < 5 && Math.abs(a.y - b.y) < 5) return;

  const mapRect = document.getElementById("map").getBoundingClientRect();
  const p1 = overlayProjection.fromContainerPixelToLatLng(
    new google.maps.Point(a.x - mapRect.left, a.y - mapRect.top));
  const p2 = overlayProjection.fromContainerPixelToLatLng(
    new google.maps.Point(b.x - mapRect.left, b.y - mapRect.top));
  const bounds = new google.maps.LatLngBounds();
  bounds.extend(p1);
  bounds.extend(p2);

  const targets = markersData.filter(m => bounds.contains({ lat: m.lat, lng: m.lng }));
  if (targets.length === 0) {
    alert("選択範囲内にアイコンがありません");
    return;
  }
  if (!confirm(`選択範囲内の ${targets.length} 件をすべて「未訪問」に戻します。よろしいですか？`)) return;

  targets.forEach(resetMarkerToUnvisited);
  saveData();
  exitSelectionMode();
}

document.addEventListener("pointerdown", (e) => {
  const menu = document.getElementById("context-menu");
  if (menu.style.display === "block" && !menu.contains(e.target)) {
    hideContextMenu();
    // メニュー外タップで閉じた際、同じタップでマーカーが追加されるのを防ぐ
    suppressNextMapClick = true;
    setTimeout(() => { suppressNextMapClick = false; }, 350);
  }
});
document.addEventListener("contextmenu", (e) => e.preventDefault());

function openRoomModal(data) {
  activeBuildingId = data.id;
  if (!data.rooms) data.rooms = defaultRooms();
  document.getElementById("room-modal-overlay").style.display = "flex";
  renderRoomGrid();
}

function closeRoomModal() {
  document.getElementById("room-modal-overlay").style.display = "none";
  activeBuildingId = null;
}

function getActiveBuilding() {
  return markersData.find(m => m.id === activeBuildingId);
}

function countVisibleRooms(r) {
  let count = 0;
  for (let floor = 1; floor <= r.maxFloor; floor++) {
    for (let num = 1; num <= r.maxRoomNum; num++) {
      const roomNo = String(floor * 100 + num);
      if (!r.hiddenRooms.includes(roomNo)) count++;
    }
  }
  return count;
}

function renderRoomGrid() {
  const b = getActiveBuilding();
  if (!b) return;
  const r = b.rooms;
  const grid = document.getElementById("room-grid");
  grid.innerHTML = "";

  for (let floor = r.maxFloor; floor >= 1; floor--) {
    const tr = document.createElement("tr");

    const label = document.createElement("td");
    label.className = "floor-label";
    label.textContent = floor + "F";
    tr.appendChild(label);

    for (let num = 1; num <= r.maxRoomNum; num++) {
      const roomNo = String(floor * 100 + num);
      if (r.hiddenRooms.includes(roomNo)) continue;

      if (!(roomNo in r.states)) r.states[roomNo] = 0;
      const st = STATUSES[r.states[roomNo]];
      const td = document.createElement("td");
      td.textContent = roomNo;
      td.style.background = st.color;
      td.style.color = st.font;

      attachPointerHandlers(td, {
        onTap: () => {
          r.states[roomNo] = (r.states[roomNo] + 1) % STATUS_COUNT;
          saveData();
          renderRoomGrid();
          refreshMarkerVisual(b); // ステータス変更時にビルアイコン色を更新
        },
        onLongPress: (x, y) => {
          const items = STATUSES.map((s, i) => ({
            swatch: s.color,
            label: s.label,
            onClick: () => {
              r.states[roomNo] = i;
              saveData();
              renderRoomGrid();
              refreshMarkerVisual(b); // ステータス変更時にビルアイコン色を更新
            },
          }));
          // 部屋ごとの削除（各階で部屋数が異なる間取りに対応）
          items.push({
            delete: true,
            label: "この部屋を削除",
            onClick: () => {
              if (countVisibleRooms(r) <= 1) {
                alert("最後の1部屋は削除できません");
                return;
              }
              if (!r.hiddenRooms.includes(roomNo)) r.hiddenRooms.push(roomNo);
              saveData();
              renderRoomGrid();
              refreshMarkerVisual(b); // 部屋削除時にビルアイコン色を更新
            },
          });
          showContextMenu(x, y, items);
        },
      });
      tr.appendChild(td);
    }
    grid.appendChild(tr);
  }
}

function roomToolAction(action) {
  const b = getActiveBuilding();
  if (!b) return;
  const r = b.rooms;

  switch (action) {
    case "addFloor": {
      r.maxFloor += 1;
      for (let num = 1; num <= r.maxRoomNum; num++) {
        r.states[String(r.maxFloor * 100 + num)] = 0;
      }
      break;
    }
    case "addRoom": {
      r.maxRoomNum += 1;
      for (let floor = 1; floor <= r.maxFloor; floor++) {
        r.states[String(floor * 100 + r.maxRoomNum)] = 0;
      }
      break;
    }
    case "removeFloor": {
      if (r.maxFloor <= 1) break;
      const f = r.maxFloor;
      for (let num = 1; num <= r.maxRoomNum; num++) {
        delete r.states[String(f * 100 + num)];
      }
      r.hiddenRooms = r.hiddenRooms.filter(no => Math.floor(Number(no) / 100) !== f);
      r.maxFloor -= 1;
      break;
    }
    case "removeRoom": {
      if (r.maxRoomNum <= 1) break;
      const n = r.maxRoomNum;
      for (let floor = 1; floor <= r.maxFloor; floor++) {
        delete r.states[String(floor * 100 + n)];
      }
      r.hiddenRooms = r.hiddenRooms.filter(no => (Number(no) % 100) !== n);
      r.maxRoomNum -= 1;
      break;
    }
    case "hide4": {
      for (let floor = 1; floor <= r.maxFloor; floor++) {
        for (let num = 1; num <= r.maxRoomNum; num++) {
          const roomNo = String(floor * 100 + num);
          if (roomNo.endsWith("4") && !r.hiddenRooms.includes(roomNo)) {
            r.hiddenRooms.push(roomNo);
          }
        }
      }
      break;
    }
  }
  saveData();
  renderRoomGrid();
  refreshMarkerVisual(b); // 部屋数増減時にビルアイコン色を更新
}

function setupUI() {
  const btnHouse = document.getElementById("btn-house");
  const btnBuilding = document.getElementById("btn-building");
  function setMode(mode) {
    currentMode = mode;
    document.getElementById("mode-" + mode).checked = true;
    btnHouse.classList.toggle("active", mode === "house");
    btnBuilding.classList.toggle("active", mode === "building");
  }
  btnHouse.addEventListener("click", () => setMode("house"));
  btnBuilding.addEventListener("click", () => setMode("building"));

  document.getElementById("btn-search").addEventListener("click", () => {
    const addr = prompt("検索する住所を入力してください");
    if (!addr || !geocoder) return;
    geocoder.geocode({ address: addr }, (results, status) => {
      if (status === "OK" && results[0]) {
        map.setCenter(results[0].geometry.location);
        map.setZoom(18);
      } else {
        alert("住所が見つかりませんでした: " + status);
      }
    });
  });

  document.getElementById("btn-lock").addEventListener("click", () => setLock(!isLocked));
  updateLockButton();

  document.getElementById("btn-select").addEventListener("click", () => {
    if (selectionMode) exitSelectionMode(); else enterSelectionMode();
  });

  const layer = document.getElementById("selection-layer");
  layer.addEventListener("pointerdown", (e) => {
    selStart = { x: e.clientX, y: e.clientY };
    const rect = document.getElementById("selection-rect");
    rect.style.display = "block";
    updateSelectionRect(selStart.x, selStart.y, selStart.x, selStart.y);
    try { layer.setPointerCapture(e.pointerId); } catch (err) {}
  });
  layer.addEventListener("pointermove", (e) => {
    if (!selStart) return;
    updateSelectionRect(selStart.x, selStart.y, e.clientX, e.clientY);
  });
  layer.addEventListener("pointerup", (e) => {
    if (!selStart) return;
    const start = selStart;
    const end = { x: e.clientX, y: e.clientY };
    selStart = null;
    document.getElementById("selection-rect").style.display = "none";
    finalizeSelection(start, end);
  });

  document.getElementById("modal-close").addEventListener("click", closeRoomModal);
  document.getElementById("room-modal-overlay").addEventListener("click", (e) => {
    if (e.target.id === "room-modal-overlay") closeRoomModal();
  });

  document.querySelectorAll(".tool-btn").forEach(btn => {
    btn.addEventListener("click", () => roomToolAction(btn.dataset.action));
  });
}
document.addEventListener("DOMContentLoaded", setupUI);
</script>
