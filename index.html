<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>訪問管理マップツール</title>
<style>
  :root {
    --panel-bg: rgba(255, 255, 255, 0.95);
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  #map {
    width: 100vw;
    height: 100vh;
  }

  #control-panel {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--panel-bg);
    padding: 8px;
    border-radius: 12px;
    box-shadow: var(--shadow);
  }

  .mode-group {
    display: flex;
    gap: 8px;
  }

  .backup-group {
    display: flex;
    gap: 8px;
  }

  .ctrl-btn.backup-btn {
    width: 50px;
    height: 50px;
    flex-direction: column;
    gap: 2px;
    font-size: 18px;
  }

  .backup-label {
    font-size: 10px;
    line-height: 1;
    font-weight: bold;
  }

  .ctrl-btn {
    width: 50px;
    height: 50px;
    border: 2px solid #d1d5db;
    border-radius: 10px;
    background: #ffffff;
    font-size: 24px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .ctrl-btn.active {
    background: #3b82f6;
    border-color: #2563eb;
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.4);
  }

  .ctrl-btn:active {
    transform: scale(0.95);
  }

  .ctrl-btn.locked {
    background: #ef4444;
    border-color: #dc2626;
    color: #ffffff;
    box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.4);
  }

  #selection-layer {
    position: fixed;
    inset: 0;
    z-index: 15;
    display: none;
    touch-action: none;
    cursor: crosshair;
    background: rgba(59, 130, 246, 0.05);
  }
  #selection-rect {
    position: fixed;
    display: none;
    border: 2px dashed #2563eb;
    background: rgba(59, 130, 246, 0.15);
    pointer-events: none;
    z-index: 16;
  }
  #selection-hint {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 17;
    background: rgba(17, 24, 39, 0.85);
    color: #ffffff;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    pointer-events: none;
    white-space: nowrap;
  }

  #toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    background: rgba(17, 24, 39, 0.9);
    color: #ffffff;
    font-size: 14px;
    padding: 10px 18px;
    border-radius: 999px;
    display: none;
    pointer-events: none;
  }

  #select-action-overlay,
  #backup-action-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
  }
  #backup-action-overlay { z-index: 55; }
  #select-action-box,
  #backup-action-box {
    background: #ffffff;
    border-radius: 16px;
    padding: 16px;
    width: min(86vw, 340px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: var(--shadow);
  }
  #select-action-box .sa-title,
  #backup-action-box .ba-title {
    font-weight: bold;
    font-size: 15px;
    text-align: center;
    margin-bottom: 4px;
  }
  #backup-action-box .ba-summary {
    font-size: 13px;
    line-height: 1.5;
    color: #374151;
    text-align: center;
    white-space: pre-line;
  }
  #select-action-box .tool-btn,
  #backup-action-box .tool-btn {
    padding: 12px;
    font-size: 15px;
    text-align: center;
  }
  #backup-action-box .tool-btn.primary,
  #select-action-box .tool-btn.primary {
    color: #ffffff;
    background: #2563eb;
    border-color: #2563eb;
    font-weight: bold;
  }

  .mode-group input[type="radio"] {
    display: none;
  }

  #legend {
    position: absolute;
    bottom: 20px;
    right: 12px;
    z-index: 20;
    background: var(--panel-bg);
    padding: 10px 12px;
    border-radius: 12px;
    box-shadow: var(--shadow);
    font-size: 13px;
  }

  #legend .legend-title {
    font-weight: bold;
    margin-bottom: 6px;
    font-size: 12px;
    color: #374151;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 3px 0;
  }

  .legend-swatch {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    border: 1px solid #9ca3af;
    flex: 0 0 auto;
  }

  .marker-wrap {
    width: 44px;
    height: 44px;
    transform: translateY(-6px);
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  .marker-wrap svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
    pointer-events: none;
  }

  #context-menu {
    position: fixed;
    z-index: 40;
    min-width: 160px;
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    padding: 6px;
    display: none;
  }

  .cm-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
  }
  .cm-item:active { background: #f3f4f6; }

  .cm-swatch {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1px solid #9ca3af;
    flex: 0 0 auto;
  }

  .cm-delete {
    color: #ef4444;
    font-weight: bold;
    border-top: 1px solid #e5e7eb;
    margin-top: 4px;
  }

  #room-modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
  }

  #room-modal {
    background: #ffffff;
    width: min(92vw, 640px);
    max-height: 88vh;
    border-radius: 16px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .modal-header {
    padding: 12px 14px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .modal-header .title {
    font-weight: bold;
    font-size: 16px;
    flex: 1 1 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .tool-btn {
    border: 1px solid #d1d5db;
    background: #f9fafb;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .tool-btn:active { background: #e5e7eb; }
  .tool-btn.danger { color: #ef4444; border-color: #fca5a5; }

  #modal-close {
    border: none;
    background: transparent;
    font-size: 22px;
    cursor: pointer;
    color: #6b7280;
    padding: 0 4px;
  }

  .modal-body {
    padding: 14px;
    overflow: auto;
  }

  table.room-grid {
    border-collapse: separate;
    border-spacing: 6px;
    margin: 0 auto;
  }
  table.room-grid td {
    width: 60px;
    height: 44px;
    text-align: center;
    vertical-align: middle;
    border-radius: 8px;
    border: 1px solid #9ca3af;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  table.room-grid td.floor-label {
    border: none;
    background: transparent !important;
    color: #6b7280;
    font-weight: normal;
    font-size: 12px;
    cursor: default;
    width: 40px;
  }
</style>
</head>
<body>
  <div id="map"></div>

  <div id="control-panel">
    <div class="mode-group">
      <input type="radio" name="mode" id="mode-house" value="house" checked />
      <label class="ctrl-btn active" id="btn-house" for="mode-house" title="家モード">🏠</label>
      <input type="radio" name="mode" id="mode-building" value="building" />
      <label class="ctrl-btn" id="btn-building" for="mode-building" title="ビルモード">🏢</label>
    </div>
    <button class="ctrl-btn" id="btn-search" title="住所検索" style="width:108px;">🔍</button>
    <button class="ctrl-btn" id="btn-lock" title="編集ロック（タップでロック）" style="width:108px;">🔓</button>
    <button class="ctrl-btn" id="btn-select" title="範囲選択して一括操作" style="width:108px;font-size:14px;">▭ 範囲選択</button>
    <div class="backup-group">
      <button class="ctrl-btn backup-btn" id="btn-backup-export" type="button" title="バックアップを書き出す" aria-label="バックアップを書き出す">⇧<span class="backup-label">書出</span></button>
      <button class="ctrl-btn backup-btn" id="btn-backup-import" type="button" title="バックアップを読み込む" aria-label="バックアップを読み込む">⇩<span class="backup-label">読込</span></button>
    </div>
    <button class="ctrl-btn" id="btn-share-import-url" type="button" title="AirDrop用の一時取り込みURLを送る" style="width:108px;font-size:13px;">🔗 AirDrop</button>
    <input type="file" id="backup-file-input" accept="application/json,.json" hidden />
  </div>

  <div id="legend">
    <div class="legend-title">ステータス凡例</div>
    <div id="legend-list"></div>
  </div>

  <div id="context-menu"></div>

  <div id="selection-layer">
    <div id="selection-hint">ドラッグで範囲を選択 → 操作を選ぶ（もう一度ボタンで解除）</div>

  <div id="toast"></div>

  <div id="select-action-overlay">
    <div id="select-action-box">
      <div class="sa-title" id="sa-title">選択範囲</div>
      <button class="tool-btn" id="sa-reset">未訪問に戻す</button>
      <button class="tool-btn" id="sa-export">選択範囲をファイル保存</button>
      <button class="tool-btn primary" id="sa-share-url">選択範囲をAirDrop送信</button>
      <button class="tool-btn danger" id="sa-delete">削除する</button>
      <button class="tool-btn" id="sa-cancel">キャンセル</button>
    </div>
  </div>

  <div id="backup-action-overlay">
    <div id="backup-action-box">
      <div class="ba-title">バックアップの読み込み</div>
      <div class="ba-summary" id="backup-action-summary"></div>
      <button class="tool-btn danger" id="backup-replace">現在のデータを置き換える</button>
      <button class="tool-btn primary" id="backup-add">現在のデータに追加する</button>
      <button class="tool-btn" id="backup-cancel">キャンセル</button>
    </div>
  </div>

  <div id="room-modal-overlay">
    <div id="room-modal">
      <div class="modal-header">
        <div class="title">
          <span>アパート部屋管理</span>
          <button id="modal-close" aria-label="閉じる">✖</button>
        </div>
        <button class="tool-btn" data-action="addFloor">＋ 行追加 (上階)</button>
        <button class="tool-btn" data-action="addRoom">＋ 列追加 (部屋)</button>
        <button class="tool-btn" data-action="removeFloor">－ 行削除</button>
        <button class="tool-btn" data-action="removeRoom">－ 列削除</button>
        <button class="tool-btn danger" data-action="hide4">✖ 「4」を削除</button>
      </div>
      <div class="modal-body">
        <table class="room-grid" id="room-grid"></table>
      </div>

<script>
const STATUSES = [
  { label: "未訪問",       color: "#ffffff", font: "#1a1a1a" },
  { label: "訪問済み",     color: "#3b82f6", font: "#ffffff" },
  { label: "留守",         color: "#eab308", font: "#1a1a1a" },
  { label: "留守２回以上", color: "#f97316", font: "#ffffff" },
  { label: "訪問拒否",     color: "#ef4444", font: "#ffffff" },
  { label: "空家",         color: "#6b7280", font: "#ffffff" },
];
const STATUS_COUNT = STATUSES.length;
const BUILDING_COLOR = "#9ca3af";
const ONLINE_AREA_COLOR = "#38bdf8";

const STORAGE_KEY = "ipad_map_markers_v5";
const LOCK_KEY = "ipad_map_locked_v1";
const BACKUP_FORMAT = "ipad_visit_map_backup";
const BACKUP_VERSION = 1;
const BACKUP_MAX_BYTES = 5 * 1024 * 1024;
const IMPORT_BASE_URL = "https://nminamigit.github.io/AreaMap/";
const IMPORT_TRANSFER_FORMAT = "ipad_visit_map_transfer";
const IMPORT_TRANSFER_VERSION = 1;
const IMPORT_LINK_TTL_MS = 24 * 60 * 60 * 1000;
const IMPORT_LINK_MAX_LENGTH = 60000;
const LONG_PRESS_MS = 600;
const MOVE_THRESHOLD = 10;
const MAP_CLICK_GUARD_MS = 500;
const MENU_ACTION_MAP_CLICK_GUARD_MS = 1200;
const TOKYO_STATION = { lat: 35.681236, lng: 139.767125 };

let map;
let AdvancedMarkerElement;
let geocoder;
let currentMode = "house";
let markersData = [];
let markerObjects = {};
let longPressTimer = null;
let longPressFired = false;
let pointerStart = { x: 0, y: 0 };
let mapClickBlockedUntil = 0;
let activeBuildingId = null;
let isLocked = false;
let selectionMode = false;
let overlayProjection = null;
let selStart = null;
let pendingSelection = null;
let pendingBackupImport = null;
let importLinkProcessing = false;

function houseSVG(color) {
  const stroke = "#1a1a1a";
  return `
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2.2 1.5 11h3v10.5h6V15h3v6.5h6V11h3z"
            fill="${color}" stroke="${stroke}" stroke-width="1"
            stroke-linejoin="round"/>
    </svg>`;
}

function buildingSVG(color = BUILDING_COLOR) {
  const stroke = "#1a1a1a";
  return `
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 2h11v20H4zM15 8h5v14h-5z"
            fill="${color}" stroke="${stroke}" stroke-width="1"
            stroke-linejoin="round"/>
      <g fill="${stroke}">
        <rect x="6"  y="4"  width="2" height="2"/>
        <rect x="9"  y="4"  width="2" height="2"/>
        <rect x="6"  y="8"  width="2" height="2"/>
        <rect x="9"  y="8"  width="2" height="2"/>
        <rect x="6"  y="12" width="2" height="2"/>
        <rect x="9"  y="12" width="2" height="2"/>
        <rect x="6"  y="16" width="2" height="2"/>
        <rect x="9"  y="16" width="2" height="2"/>
        <rect x="16.5" y="11" width="1.6" height="1.6"/>
        <rect x="16.5" y="15" width="1.6" height="1.6"/>
      </g>
    </svg>`;
}

function getBuildingColor(data) {
  // オンライン区域の場合は最優先でオレンジ
  if (data.isOnlineArea) return ONLINE_AREA_COLOR;

  const r = data.rooms;
  if (!r) return BUILDING_COLOR;

  let validRoomCount = 0;
  let hasUnvisited = false;
  let hasBlueOrYellow = false;

  for (let floor = 1; floor <= r.maxFloor; floor++) {
    for (let num = 1; num <= r.maxRoomNum; num++) {
      const roomNo = String(floor * 100 + num);
      if (r.hiddenRooms.includes(roomNo)) continue;
      
      validRoomCount++;
      const st = r.states[roomNo] || 0;
      if (st === 0) hasUnvisited = true; // 0: 未訪問
      if (st === 1 || st === 2) hasBlueOrYellow = true; // 1: 青(訪問済), 2: 黄(留守)
    }
  }

  // 優先順位に沿って色を判定
  if (validRoomCount <= 1) return "#9ca3af"; // グレー (101のみ等の初期状態)
  if (!hasUnvisited && validRoomCount > 0) return "#3b82f6"; // 青 (未訪問が1件もない時)
  if (hasBlueOrYellow) return "#eab308"; // 黄色 (1件でも青か黄がある時)
  return "#ffffff"; // 白 (2部屋以上で上記以外)
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(markersData));
  } catch (e) {
    console.error("保存失敗:", e);
  }
}

function loadLock() {
  try {
    return JSON.parse(localStorage.getItem(LOCK_KEY)) === true;
  } catch (e) {
    return false;
  }
}

function updateLockButton() {
  const btn = document.getElementById("btn-lock");
  if (!btn) return;
  btn.textContent = isLocked ? "🔒" : "🔓";
  btn.classList.toggle("locked", isLocked);
  btn.title = isLocked ? "編集ロック中（タップで解除）" : "編集ロック（タップでロック）";
}

function setLock(locked) {
  isLocked = locked;
  try {
    localStorage.setItem(LOCK_KEY, JSON.stringify(isLocked));
  } catch (e) {
    console.error("ロック状態の保存失敗:", e);
  }
  // 既存マーカーのドラッグ可否を一括反映
  Object.values(markerObjects).forEach(obj => { obj.gmarker.gmpDraggable = !isLocked; });
  updateLockButton();
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    console.error("読込失敗:", e);
    return [];
  }
}

function formatBackupTimestamp(date) {
  const pad = (value) => String(value).padStart(2, "0");
  return String(date.getFullYear())
    + pad(date.getMonth() + 1)
    + pad(date.getDate())
    + "_"
    + pad(date.getHours())
    + pad(date.getMinutes());
}

function buildBackupPayload(markerSubset = null, scope = "all") {
  const storedMarkers = markerSubset === null ? loadData() : markerSubset;
  const sourceMarkers = Array.isArray(storedMarkers) ? storedMarkers : [];
  return {
    format: BACKUP_FORMAT,
    version: BACKUP_VERSION,
    scope,
    exportedAt: new Date().toISOString(),
    markers: sourceMarkers.map(cloneMarkerData),
    isLocked: loadLock(),
  };
}

function downloadBackupBlob(blob, fileName, message = "バックアップを保存しました") {
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast(message);
}

async function exportBackup(markerSubset = null, scope = "all") {
  const isSelection = scope === "selection";
  const payload = buildBackupPayload(markerSubset, scope);
  const json = JSON.stringify(payload, null, 2);
  const filePrefix = isSelection ? "訪問管理マップ_範囲バックアップ_" : "訪問管理マップ_バックアップ_";
  const fileName = filePrefix + formatBackupTimestamp(new Date()) + ".json";
  const blob = new Blob([json], { type: "application/json" });
  const file = typeof File === "function"
    ? new File([blob], fileName, { type: "application/json" })
    : null;

  let canShareFile = false;
  if (file && navigator.share && navigator.canShare) {
    try {
      canShareFile = navigator.canShare({ files: [file] });
    } catch (e) {
      canShareFile = false;
    }
  }

  if (canShareFile) {
    try {
      await navigator.share({
        title: isSelection ? "訪問管理マップ 範囲バックアップ" : "訪問管理マップ バックアップ",
        text: isSelection ? "選択範囲の訪問管理マップのバックアップです。" : "訪問管理マップのバックアップです。",
        files: [file],
      });
      return "shared";
    } catch (e) {
      if (e && e.name === "AbortError") return "cancelled";
      console.warn("共有画面を開けなかったため、ファイル保存に切り替えます。", e);
    }
  }

  downloadBackupBlob(blob, fileName, isSelection ? "選択範囲のバックアップを保存しました" : "バックアップを保存しました");
  return "downloaded";
}

function bytesToBase64Url(bytes) {
  let binary = "";
  const chunkSize = 0x8000;
  for (let offset = 0; offset < bytes.length; offset += chunkSize) {
    binary += String.fromCharCode(...bytes.subarray(offset, offset + chunkSize));
  }
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

function base64UrlToBytes(value) {
  if (!/^[A-Za-z0-9_-]+$/.test(value)) throw new Error("取り込みURLの形式が不正です。");
  const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
  const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
  let binary;
  try {
    binary = atob(padded);
  } catch (e) {
    throw new Error("取り込みURLの形式が不正です。");
  }
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function compressImportBytes(bytes) {
  if (typeof CompressionStream !== "function") return { codec: "raw", bytes };
  try {
    const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
    return { codec: "gzip", bytes: new Uint8Array(await new Response(stream).arrayBuffer()) };
  } catch (e) {
    console.warn("URL用データを圧縮できなかったため、非圧縮で続行します。", e);
    return { codec: "raw", bytes };
  }
}

async function decompressImportBytes(bytes, codec) {
  if (codec === "raw") return bytes;
  if (codec !== "gzip" || typeof DecompressionStream !== "function") {
    throw new Error("この端末では取り込みURLを展開できません。JSONファイルで読み込んでください。");
  }
  try {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  } catch (e) {
    throw new Error("取り込みURLのデータが破損しています。");
  }
}

async function createImportUrl(markerSubset = null, scope = "all", expiresAt = Date.now() + IMPORT_LINK_TTL_MS) {
  if (typeof crypto === "undefined" || !crypto.subtle) {
    throw new Error("この端末では一時取り込みURLを作成できません。JSONファイルで書き出してください。");
  }

  const transfer = {
    format: IMPORT_TRANSFER_FORMAT,
    version: IMPORT_TRANSFER_VERSION,
    expiresAt,
    backup: buildBackupPayload(markerSubset, scope),
  };
  const plainBytes = new TextEncoder().encode(JSON.stringify(transfer));
  const compressed = await compressImportBytes(plainBytes);
  const keyBytes = crypto.getRandomValues(new Uint8Array(32));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM" }, false, ["encrypt"]);
  const encrypted = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, compressed.bytes));
  const token = [
    "v1",
    compressed.codec,
    bytesToBase64Url(iv),
    bytesToBase64Url(keyBytes),
    bytesToBase64Url(encrypted),
  ].join(".");
  const url = IMPORT_BASE_URL + "#import=" + token;
  if (url.length > IMPORT_LINK_MAX_LENGTH) {
    throw new Error("データ量が多いためURL送信できません。JSONファイルの書き出しを使用してください。");
  }
  return url;
}

async function decodeImportToken(token, now = Date.now()) {
  const parts = String(token || "").split(".");
  if (parts.length !== 5 || parts[0] !== "v1") throw new Error("取り込みURLの形式が不正です。");
  if (typeof crypto === "undefined" || !crypto.subtle) {
    throw new Error("この端末では取り込みURLを読み取れません。JSONファイルで読み込んでください。");
  }

  const codec = parts[1];
  const iv = base64UrlToBytes(parts[2]);
  const keyBytes = base64UrlToBytes(parts[3]);
  const encrypted = base64UrlToBytes(parts[4]);
  if (iv.length !== 12 || keyBytes.length !== 32) throw new Error("取り込みURLの形式が不正です。");

  let decrypted;
  try {
    const key = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-GCM" }, false, ["decrypt"]);
    decrypted = new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, encrypted));
  } catch (e) {
    throw new Error("取り込みURLのデータが破損しています。");
  }

  const plainBytes = await decompressImportBytes(decrypted, codec);
  let transfer;
  try {
    transfer = JSON.parse(new TextDecoder().decode(plainBytes));
  } catch (e) {
    throw new Error("取り込みURLのデータを読み取れませんでした。");
  }
  if (!isPlainObject(transfer)
      || transfer.format !== IMPORT_TRANSFER_FORMAT
      || transfer.version !== IMPORT_TRANSFER_VERSION
      || !Number.isFinite(transfer.expiresAt)
      || !isPlainObject(transfer.backup)) {
    throw new Error("取り込みURLのデータ形式が不正です。");
  }
  if (now > transfer.expiresAt) throw new Error("この取り込みURLは有効期限（24時間）を過ぎています。");
  return parseBackupPayload(JSON.stringify(transfer.backup));
}

async function shareImportUrl(markerSubset = null, scope = "all") {
  const isSelection = scope === "selection";
  const url = await createImportUrl(markerSubset, scope);
  if (navigator.share) {
    try {
      await navigator.share({
        title: isSelection ? "訪問管理マップ 選択範囲の取り込み" : "訪問管理マップ データ取り込み",
        text: "このURLは24時間有効です。タップすると訪問管理マップに取り込めます。",
        url,
      });
      return "shared";
    } catch (e) {
      if (e && e.name === "AbortError") return "cancelled";
      console.warn("共有画面を開けなかったため、URLのコピーに切り替えます。", e);
    }
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    await navigator.clipboard.writeText(url);
    showToast("取り込みURLをコピーしました");
    return "copied";
  }
  prompt("次の取り込みURLをコピーして送信してください（24時間有効）", url);
  return "shown";
}

function clearImportHash() {
  if (typeof history !== "undefined" && history.replaceState && typeof location !== "undefined") {
    history.replaceState(null, document.title, location.pathname + location.search);
  }
}

async function processImportUrl() {
  if (importLinkProcessing || typeof location === "undefined" || !location.hash.startsWith("#import=")) return;
  importLinkProcessing = true;
  const token = location.hash.slice("#import=".length);
  try {
    const backup = await decodeImportToken(token);
    clearImportHash();
    openBackupActionDialog(backup);
  } catch (e) {
    clearImportHash();
    console.error("一時取り込みURLの読込失敗:", e);
    alert("取り込みURLを読み込めませんでした。\n" + (e && e.message ? e.message : "URLを確認してください。"));
  } finally {
    importLinkProcessing = false;
  }
}

function isPlainObject(value) {
  return value !== null && typeof value === "object" && !Array.isArray(value);
}

function requireInteger(value, min, max, label) {
  if (!Number.isInteger(value) || value < min || value > max) {
    throw new Error(label + "が不正です。");
  }
  return value;
}

function normalizeBackupMarker(raw, index) {
  const label = (index + 1) + "件目のアイコン";
  if (!isPlainObject(raw)) throw new Error(label + "の形式が不正です。");

  const id = typeof raw.id === "string" || typeof raw.id === "number" ? String(raw.id) : "";
  if (!id) throw new Error(label + "のIDがありません。");

  const lat = Number(raw.lat);
  const lng = Number(raw.lng);
  if (!Number.isFinite(lat) || lat < -90 || lat > 90 || !Number.isFinite(lng) || lng < -180 || lng > 180) {
    throw new Error(label + "の位置情報が不正です。");
  }

  if (raw.type !== "house" && raw.type !== "building") {
    throw new Error(label + "の種類が不正です。");
  }

  const statusIndex = requireInteger(raw.statusIndex, 0, STATUS_COUNT - 1, label + "の状態");
  if (raw.type === "house") {
    return { id, lat, lng, statusIndex, type: "house", rooms: null, isOnlineArea: false };
  }

  if (!isPlainObject(raw.rooms)) throw new Error(label + "の部屋情報がありません。");
  const maxFloor = requireInteger(raw.rooms.maxFloor, 1, 1000, label + "の階数");
  const maxRoomNum = requireInteger(raw.rooms.maxRoomNum, 1, 1000, label + "の部屋数");
  const rawStates = raw.rooms.states === undefined ? {} : raw.rooms.states;
  if (!isPlainObject(rawStates)) throw new Error(label + "の部屋状態が不正です。");

  const states = {};
  Object.entries(rawStates).forEach(([roomNo, state]) => {
    if (!/^\d+$/.test(roomNo)) throw new Error(label + "の部屋番号が不正です。");
    states[roomNo] = requireInteger(state, 0, STATUS_COUNT - 1, label + "の部屋状態");
  });

  const rawHiddenRooms = raw.rooms.hiddenRooms === undefined ? [] : raw.rooms.hiddenRooms;
  if (!Array.isArray(rawHiddenRooms)) throw new Error(label + "の削除済み部屋情報が不正です。");
  const hiddenRooms = [...new Set(rawHiddenRooms.map((roomNo) => {
    const normalized = String(roomNo);
    if (!/^\d+$/.test(normalized)) throw new Error(label + "の削除済み部屋番号が不正です。");
    return normalized;
  }))];

  if (raw.isOnlineArea !== undefined && typeof raw.isOnlineArea !== "boolean") {
    throw new Error(label + "のオンライン区域設定が不正です。");
  }

  return {
    id,
    lat,
    lng,
    statusIndex,
    type: "building",
    rooms: { maxFloor, maxRoomNum, states, hiddenRooms },
    isOnlineArea: raw.isOnlineArea === true,
  };
}

function parseBackupPayload(text) {
  let raw;
  try {
    raw = JSON.parse(text);
  } catch (e) {
    throw new Error("JSONファイルを読み取れませんでした。");
  }

  if (!isPlainObject(raw) || raw.format !== BACKUP_FORMAT || raw.version !== BACKUP_VERSION) {
    throw new Error("このアプリのバックアップファイルではありません。");
  }
  if (!Array.isArray(raw.markers)) throw new Error("アイコンデータがありません。");
  if (typeof raw.isLocked !== "boolean") throw new Error("編集ロック情報が不正です。");
  const scope = raw.scope === undefined ? "all" : raw.scope;
  if (scope !== "all" && scope !== "selection") throw new Error("バックアップの範囲情報が不正です。");

  const markers = raw.markers.map(normalizeBackupMarker);
  const ids = new Set();
  markers.forEach((marker) => {
    if (ids.has(marker.id)) throw new Error("同じIDのアイコンが重複しています。");
    ids.add(marker.id);
  });

  return { markers, isLocked: raw.isLocked, scope };
}

function restoreStorageValue(key, value) {
  if (value === null) localStorage.removeItem(key);
  else localStorage.setItem(key, value);
}

function cloneMarkerData(marker) {
  return JSON.parse(JSON.stringify(marker));
}

function mergeBackupMarkers(currentMarkers, importedMarkers) {
  const merged = currentMarkers.map(cloneMarkerData);
  const usedIds = new Set(merged.map((marker) => String(marker.id)));
  const importedAt = Date.now();

  importedMarkers.forEach((marker, index) => {
    const copy = cloneMarkerData(marker);
    let candidate = String(copy.id);
    if (usedIds.has(candidate)) {
      const base = candidate + "_import_" + importedAt;
      candidate = base + "_" + (index + 1);
      let suffix = 2;
      while (usedIds.has(candidate)) {
        candidate = base + "_" + (index + 1) + "_" + suffix;
        suffix += 1;
      }
    }
    copy.id = candidate;
    usedIds.add(candidate);
    merged.push(copy);
  });

  return merged;
}

function applyImportedBackup(backup, mode) {
  if (mode !== "replace" && mode !== "add") {
    throw new Error("読み込み方法が不正です。");
  }

  const storedMarkers = loadData();
  const currentMarkers = Array.isArray(storedMarkers) ? storedMarkers : [];
  const nextMarkers = mode === "add"
    ? mergeBackupMarkers(currentMarkers, backup.markers)
    : backup.markers.map(cloneMarkerData);
  const nextLock = mode === "add" ? loadLock() : backup.isLocked;

  const previousMarkers = localStorage.getItem(STORAGE_KEY);
  const previousLock = localStorage.getItem(LOCK_KEY);
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(nextMarkers));
    localStorage.setItem(LOCK_KEY, JSON.stringify(nextLock));
  } catch (e) {
    try {
      restoreStorageValue(STORAGE_KEY, previousMarkers);
      restoreStorageValue(LOCK_KEY, previousLock);
    } catch (restoreError) {
      console.error("バックアップ復元後のロールバックに失敗しました。", restoreError);
    }
    throw new Error("端末にデータを保存できませんでした。");
  }

  if (selectionMode && map) exitSelectionMode();
  closeSelectionActionDialog();
  closeRoomModal();
  hideContextMenu();

  Object.values(markerObjects).forEach((obj) => { obj.gmarker.map = null; });
  markerObjects = {};
  markersData = nextMarkers;
  isLocked = nextLock;

  if (map && AdvancedMarkerElement) markersData.forEach(createMarkerObject);
  updateLockButton();
  return { importedCount: backup.markers.length, totalCount: nextMarkers.length, mode };
}

function openBackupActionDialog(backup) {
  pendingBackupImport = backup;
  const backupLabel = backup.scope === "selection" ? "範囲バックアップ" : "バックアップ";
  document.getElementById("backup-action-summary").textContent =
    backupLabel + "内のアイコン：" + backup.markers.length + " 件\n"
    + "置き換え、または現在のデータへの追加を選んでください。";
  document.getElementById("backup-action-overlay").style.display = "flex";
}

function closeBackupActionDialog() {
  document.getElementById("backup-action-overlay").style.display = "none";
  pendingBackupImport = null;
}

function completePendingBackupImport(mode) {
  if (!pendingBackupImport) return null;
  const result = applyImportedBackup(pendingBackupImport, mode);
  closeBackupActionDialog();
  if (mode === "add") {
    showToast(result.importedCount + " 件を追加しました（合計 " + result.totalCount + " 件）");
  } else {
    showToast(result.importedCount + " 件のバックアップに置き換えました");
  }
  return result;
}

function readBackupFile(file) {
  if (typeof file.text === "function") return file.text();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("ファイルを読み取れませんでした。"));
    reader.readAsText(file);
  });
}

async function importBackupFile(file) {
  if (!file) return;
  if (file.size > BACKUP_MAX_BYTES) {
    throw new Error("バックアップファイルが大きすぎます（上限5MB）。");
  }

  const backup = parseBackupPayload(await readBackupFile(file));
  openBackupActionDialog(backup);
}

function renderLegend() {
  const list = document.getElementById("legend-list");
  let html = STATUSES.map(s =>
    `<div class="legend-row">
       <span class="legend-swatch" style="background:${s.color}"></span>
       <span>${s.label}</span>
     </div>`
  ).join("");
  html += `<div class="legend-row">
       <span class="legend-swatch" style="background:${ONLINE_AREA_COLOR}"></span>
       <span>オンライン区域（ビル）</span>
     </div>`;
  list.innerHTML = html;
}

async function initMap() {
  const { Map } = await google.maps.importLibrary("maps");
  const markerLib = await google.maps.importLibrary("marker");
  AdvancedMarkerElement = markerLib.AdvancedMarkerElement;
  await google.maps.importLibrary("geocoding");
  geocoder = new google.maps.Geocoder();

  map = new Map(document.getElementById("map"), {
    center: TOKYO_STATION,
    zoom: 16,
    disableDoubleClickZoom: true,
    disableDefaultUI: true,
    zoomControl: true,
    gestureHandling: "greedy",
    clickableIcons: false,
    mapId: "DEMO_MAP_ID",
  });

  map.addListener("click", (e) => {
    if (isMapClickBlocked()) return;
    // マーカー長押し等の残余クリックではメニューを閉じない（ロック中でも維持）
    hideContextMenu();
    if (isLocked) return;
    addMarker(e.latLng.lat(), e.latLng.lng(), currentMode);
  });
  
  map.addListener("dragstart", hideContextMenu);
  initProjectionHelper();

  markersData = loadData();
  isLocked = loadLock();
  markersData.forEach(createMarkerObject);
  updateLockButton();

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        map.setCenter({ lat: pos.coords.latitude, lng: pos.coords.longitude });
        map.setZoom(16);
      },
      () => {},
      { enableHighAccuracy: true, timeout: 8000 }
    );
  }

  renderLegend();
}
window.initMap = initMap;

function defaultRooms() {
  return {
    maxFloor: 1,
    maxRoomNum: 1,
    states: { "101": 0 },
    hiddenRooms: [],
  };
}

function addMarker(lat, lng, type) {
  const data = {
    id: String(Date.now()),
    lat, lng,
    statusIndex: 0,
    type,
    rooms: type === "building" ? defaultRooms() : null,
    isOnlineArea: false // 新規追加フラグ
  };
  markersData.push(data);
  createMarkerObject(data);
  saveData();
}

function createMarkerObject(data) {
  const wrap = document.createElement("div");
  wrap.className = "marker-wrap";
  wrap.innerHTML = data.type === "house"
    ? houseSVG(STATUSES[data.statusIndex].color)
    : buildingSVG(getBuildingColor(data));

  const gmarker = new AdvancedMarkerElement({
    map,
    position: { lat: data.lat, lng: data.lng },
    content: wrap,
    gmpDraggable: !isLocked,
  });

  gmarker.addListener("dragstart", () => {
    clearLongPress();
    longPressFired = true; 
  });
  gmarker.addListener("dragend", () => {
    const p = gmarker.position;
    data.lat = (typeof p.lat === "function") ? p.lat() : p.lat;
    data.lng = (typeof p.lng === "function") ? p.lng() : p.lng;
    saveData();
    blockMapClicksFor(MAP_CLICK_GUARD_MS);
  });

  attachPointerHandlers(wrap, {
    onTap: () => handleMarkerTap(data),
    onLongPress: (x, y) => handleMarkerLongPress(data, x, y),
  });

  markerObjects[data.id] = { data, gmarker, contentEl: wrap };
}

function refreshMarkerVisual(data) {
  const obj = markerObjects[data.id];
  if (!obj) return;
  obj.contentEl.innerHTML = data.type === "house"
    ? houseSVG(STATUSES[data.statusIndex].color)
    : buildingSVG(getBuildingColor(data));
}

function removeMarker(id) {
  const obj = markerObjects[id];
  if (obj) {
    obj.gmarker.map = null;
    delete markerObjects[id];
  }
  markersData = markersData.filter(m => m.id !== id);
  saveData();
}

function attachPointerHandlers(el, { onTap, onLongPress }) {
  el.addEventListener("pointerdown", (e) => {
    pointerStart = { x: e.clientX, y: e.clientY };
    longPressFired = false;
    clearLongPress();
    longPressTimer = setTimeout(() => {
      longPressFired = true;
      onLongPress(e.clientX, e.clientY);
    }, LONG_PRESS_MS);
  });

  el.addEventListener("pointermove", (e) => {
    const dx = Math.abs(e.clientX - pointerStart.x);
    const dy = Math.abs(e.clientY - pointerStart.y);
    if (dx > MOVE_THRESHOLD || dy > MOVE_THRESHOLD) {
      clearLongPress();
    }
  });

  el.addEventListener("pointerup", (e) => {
    clearLongPress();
    blockMapClicksFor(MAP_CLICK_GUARD_MS);
    if (longPressFired) return;
    const dx = Math.abs(e.clientX - pointerStart.x);
    const dy = Math.abs(e.clientY - pointerStart.y);
    if (dx > MOVE_THRESHOLD || dy > MOVE_THRESHOLD) return;
    onTap();
  });

  el.addEventListener("pointercancel", () => {
    clearLongPress();
  });

  el.addEventListener("contextmenu", (e) => e.preventDefault());
}

function clearLongPress() {
  if (longPressTimer) {
    clearTimeout(longPressTimer);
    longPressTimer = null;
  }
}

function blockMapClicksFor(durationMs) {
  mapClickBlockedUntil = Math.max(mapClickBlockedUntil, Date.now() + durationMs);
}

function isMapClickBlocked() {
  return Date.now() < mapClickBlockedUntil;
}

function handleMarkerTap(data) {
  if (data.type === "house") {
    data.statusIndex = (data.statusIndex + 1) % STATUS_COUNT;
    refreshMarkerVisual(data);
    saveData();
  } else {
    if (data.isOnlineArea) {
      showToast("オンライン区域");
      return;
    }
    openRoomModal(data);
  }
}

function handleMarkerLongPress(data, x, y) {
  const items = [];
  if (data.type === "house") {
    STATUSES.forEach((s, i) => {
      items.push({
        swatch: s.color,
        label: s.label,
        onClick: () => {
          data.statusIndex = i;
          refreshMarkerVisual(data);
          saveData();
        },
      });
    });
  } else if (data.type === "building") {
    // オンライン区域のトグル設定追加
    items.push({
      label: data.isOnlineArea ? "✅ オンライン区域" : "オンライン区域",
      onClick: () => {
        data.isOnlineArea = !data.isOnlineArea;
        refreshMarkerVisual(data);
        saveData();
      }
    });
  }

  items.push({
    delete: true,
    label: "アイコンを削除",
    onClick: () => removeMarker(data.id),
  });
  showContextMenu(x, y, items);
}

function showContextMenu(x, y, items) {
  const menu = document.getElementById("context-menu");
  menu.innerHTML = "";
  items.forEach(it => {
    const div = document.createElement("div");
    div.className = "cm-item" + (it.delete ? " cm-delete" : "");
    if (it.swatch) {
      div.innerHTML = `<span class="cm-swatch" style="background:${it.swatch}"></span><span>${it.label}</span>`;
    } else {
      div.innerHTML = `<span>${it.label}</span>`;
    }
    
    // メニュー操作を地図タップとして扱わせない。
    // Google Maps側のクリックはDOMイベントより遅れて届く場合があるため、
    // stopPropagationに加えて時刻ベースのガードを使用する。
    div.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      blockMapClicksFor(MENU_ACTION_MAP_CLICK_GUARD_MS);
    });
    div.addEventListener("click", (e) => {
      e.stopPropagation();
      e.preventDefault();
    });
    div.addEventListener("pointerup", (e) => {
      e.stopPropagation();
      e.preventDefault();
      hideContextMenu();
      blockMapClicksFor(MENU_ACTION_MAP_CLICK_GUARD_MS);
      it.onClick();
    });
    menu.appendChild(div);
  });

  menu.style.display = "block";
  menu.style.left = "0px";
  menu.style.top = "0px";
  const rect = menu.getBoundingClientRect();
  let left = x;
  let top = y;
  if (left + rect.width > window.innerWidth - 8) left = window.innerWidth - rect.width - 8;
  if (top + rect.height > window.innerHeight - 8) top = window.innerHeight - rect.height - 8;
  if (left < 8) left = 8;
  if (top < 8) top = 8;
  menu.style.left = left + "px";
  menu.style.top = top + "px";
}

function hideContextMenu() {
  const menu = document.getElementById("context-menu");
  menu.style.display = "none";
}

function initProjectionHelper() {
  const ov = new google.maps.OverlayView();
  ov.onAdd = function () {};
  ov.draw = function () { overlayProjection = this.getProjection(); };
  ov.onRemove = function () {};
  ov.setMap(map);
}

function enterSelectionMode() {
  selectionMode = true;
  hideContextMenu();
  document.getElementById("btn-select").classList.add("active");
  document.getElementById("selection-layer").style.display = "block";
  map.setOptions({ gestureHandling: "none", draggable: false });
}

function exitSelectionMode() {
  selectionMode = false;
  selStart = null;
  document.getElementById("btn-select").classList.remove("active");
  document.getElementById("selection-layer").style.display = "none";
  document.getElementById("selection-rect").style.display = "none";

}

function updateSelectionRect(x1, y1, x2, y2) {
  const rect = document.getElementById("selection-rect");
  rect.style.left = Math.min(x1, x2) + "px";
  rect.style.top = Math.min(y1, y2) + "px";
  rect.style.width = Math.abs(x2 - x1) + "px";
  rect.style.height = Math.abs(y2 - y1) + "px";
}

function resetMarkerToUnvisited(data) {
  if (data.type === "house") {
    data.statusIndex = 0;
  } else if (data.rooms) {
    Object.keys(data.rooms.states).forEach(k => { data.rooms.states[k] = 0; });
  }
  refreshMarkerVisual(data);
}

function finalizeSelection(a, b) {
  if (!overlayProjection) { exitSelectionMode(); return; }
  // 誤タップ相当（極端に小さい範囲）は無視
  if (Math.abs(a.x - b.x) < 5 && Math.abs(a.y - b.y) < 5) return;

  const mapRect = document.getElementById("map").getBoundingClientRect();
  const p1 = overlayProjection.fromContainerPixelToLatLng(
    new google.maps.Point(a.x - mapRect.left, a.y - mapRect.top));
  const p2 = overlayProjection.fromContainerPixelToLatLng(
    new google.maps.Point(b.x - mapRect.left, b.y - mapRect.top));
  const bounds = new google.maps.LatLngBounds();
  bounds.extend(p1);
  bounds.extend(p2);

  const targets = markersData.filter(m => bounds.contains({ lat: m.lat, lng: m.lng }));
  if (targets.length === 0) {
    alert("選択範囲内にアイコンがありません");
    return;
  }
  openSelectionActionDialog(targets);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => { t.style.display = "none"; }, 1500);
}

function openSelectionActionDialog(targets) {
  pendingSelection = targets;
  document.getElementById("sa-title").textContent = "選択範囲内の " + targets.length + " 件";
  document.getElementById("select-action-overlay").style.display = "flex";
}

function closeSelectionActionDialog() {
  document.getElementById("select-action-overlay").style.display = "none";
  pendingSelection = null;
}

document.addEventListener("pointerdown", (e) => {
  const menu = document.getElementById("context-menu");
  if (menu.style.display === "block" && !menu.contains(e.target)) {
    hideContextMenu();
    // メニュー外タップで閉じた際、同じタップでマーカーが追加されるのを防ぐ
    blockMapClicksFor(MAP_CLICK_GUARD_MS);
  }
});
document.addEventListener("contextmenu", (e) => e.preventDefault());

function openRoomModal(data) {
  activeBuildingId = data.id;
  if (!data.rooms) data.rooms = defaultRooms();
  document.getElementById("room-modal-overlay").style.display = "flex";
  renderRoomGrid();
}

function closeRoomModal() {
  document.getElementById("room-modal-overlay").style.display = "none";
  activeBuildingId = null;
}

function getActiveBuilding() {
  return markersData.find(m => m.id === activeBuildingId);
}

function countVisibleRooms(r) {
  let count = 0;
  for (let floor = 1; floor <= r.maxFloor; floor++) {
    for (let num = 1; num <= r.maxRoomNum; num++) {
      const roomNo = String(floor * 100 + num);
      if (!r.hiddenRooms.includes(roomNo)) count++;
    }
  }
  return count;
}

function renderRoomGrid() {
  const b = getActiveBuilding();
  if (!b) return;
  const r = b.rooms;
  const grid = document.getElementById("room-grid");
  grid.innerHTML = "";

  for (let floor = r.maxFloor; floor >= 1; floor--) {
    const tr = document.createElement("tr");

    const label = document.createElement("td");
    label.className = "floor-label";
    label.textContent = floor + "F";
    tr.appendChild(label);

    for (let num = 1; num <= r.maxRoomNum; num++) {
      const roomNo = String(floor * 100 + num);
      if (r.hiddenRooms.includes(roomNo)) continue;

      if (!(roomNo in r.states)) r.states[roomNo] = 0;
      const st = STATUSES[r.states[roomNo]];
      const td = document.createElement("td");
      td.textContent = roomNo;
      td.style.background = st.color;
      td.style.color = st.font;

      attachPointerHandlers(td, {
        onTap: () => {
          r.states[roomNo] = (r.states[roomNo] + 1) % STATUS_COUNT;
          saveData();
          renderRoomGrid();
          refreshMarkerVisual(b); // ステータス変更時にビルアイコン色を更新
        },
        onLongPress: (x, y) => {
          const items = STATUSES.map((s, i) => ({
            swatch: s.color,
            label: s.label,
            onClick: () => {
              r.states[roomNo] = i;
              saveData();
              renderRoomGrid();
              refreshMarkerVisual(b); // ステータス変更時にビルアイコン色を更新
            },
          }));
          // 部屋ごとの削除（各階で部屋数が異なる間取りに対応）
          items.push({
            delete: true,
            label: "この部屋を削除",
            onClick: () => {
              if (countVisibleRooms(r) <= 1) {
                alert("最後の1部屋は削除できません");
                return;
              }
              if (!r.hiddenRooms.includes(roomNo)) r.hiddenRooms.push(roomNo);
              saveData();
              renderRoomGrid();
              refreshMarkerVisual(b); // 部屋削除時にビルアイコン色を更新
            },
          });
          showContextMenu(x, y, items);
        },
      });
      tr.appendChild(td);
    }
    grid.appendChild(tr);
  }
}

function roomToolAction(action) {
  const b = getActiveBuilding();
  if (!b) return;
  const r = b.rooms;

  switch (action) {
    case "addFloor": {
      r.maxFloor += 1;
      for (let num = 1; num <= r.maxRoomNum; num++) {
        r.states[String(r.maxFloor * 100 + num)] = 0;
      }
      break;
    }
    case "addRoom": {
      r.maxRoomNum += 1;
      for (let floor = 1; floor <= r.maxFloor; floor++) {
        r.states[String(floor * 100 + r.maxRoomNum)] = 0;
      }
      break;
    }
    case "removeFloor": {
      if (r.maxFloor <= 1) break;
      const f = r.maxFloor;
      for (let num = 1; num <= r.maxRoomNum; num++) {
        delete r.states[String(f * 100 + num)];
      }
      r.hiddenRooms = r.hiddenRooms.filter(no => Math.floor(Number(no) / 100) !== f);
      r.maxFloor -= 1;
      break;
    }
    case "removeRoom": {
      if (r.maxRoomNum <= 1) break;
      const n = r.maxRoomNum;
      for (let floor = 1; floor <= r.maxFloor; floor++) {
        delete r.states[String(floor * 100 + n)];
      }
      r.hiddenRooms = r.hiddenRooms.filter(no => (Number(no) % 100) !== n);
      r.maxRoomNum -= 1;
      break;
    }
    case "hide4": {
      for (let floor = 1; floor <= r.maxFloor; floor++) {
        for (let num = 1; num <= r.maxRoomNum; num++) {
          const roomNo = String(floor * 100 + num);
          if (roomNo.endsWith("4") && !r.hiddenRooms.includes(roomNo)) {
            r.hiddenRooms.push(roomNo);
          }
        }
      }
      break;
    }
  }
  saveData();
  renderRoomGrid();
  refreshMarkerVisual(b); // 部屋数増減時にビルアイコン色を更新
}

function setupUI() {
  const btnHouse = document.getElementById("btn-house");
  const btnBuilding = document.getElementById("btn-building");
  function setMode(mode) {
    currentMode = mode;
    document.getElementById("mode-" + mode).checked = true;
    btnHouse.classList.toggle("active", mode === "house");
    btnBuilding.classList.toggle("active", mode === "building");
  }
  btnHouse.addEventListener("click", () => setMode("house"));
  btnBuilding.addEventListener("click", () => setMode("building"));

  document.getElementById("btn-search").addEventListener("click", () => {
    const addr = prompt("検索する住所を入力してください");
    if (!addr || !geocoder) return;
    geocoder.geocode({ address: addr }, (results, status) => {
      if (status === "OK" && results[0]) {
        map.setCenter(results[0].geometry.location);
        map.setZoom(18);
      } else {
        alert("住所が見つかりませんでした: " + status);
      }
    });
  });

  document.getElementById("btn-lock").addEventListener("click", () => setLock(!isLocked));
  updateLockButton();

  document.getElementById("btn-select").addEventListener("click", () => {
    if (selectionMode) exitSelectionMode(); else enterSelectionMode();
  });

  document.getElementById("btn-backup-export").addEventListener("click", () => {
    exportBackup().catch((e) => {
      console.error("バックアップ書き出し失敗:", e);
      alert("バックアップを書き出せませんでした。");
    });
  });
  document.getElementById("btn-share-import-url").addEventListener("click", () => {
    shareImportUrl().catch((e) => {
      console.error("一時取り込みURLの作成失敗:", e);
      alert("一時取り込みURLを作成できませんでした。\n" + (e && e.message ? e.message : "JSONファイルで書き出してください。"));
    });
  });

  const backupFileInput = document.getElementById("backup-file-input");
  document.getElementById("btn-backup-import").addEventListener("click", () => {
    backupFileInput.value = "";
    backupFileInput.click();
  });
  backupFileInput.addEventListener("change", async () => {
    const file = backupFileInput.files && backupFileInput.files[0];
    try {
      await importBackupFile(file);
    } catch (e) {
      console.error("バックアップ読み込み失敗:", e);
      alert("バックアップを読み込めませんでした。\n" + (e && e.message ? e.message : "ファイルを確認してください。"));
    } finally {
      backupFileInput.value = "";
    }
  });

  const runBackupImport = (mode) => {
    try {
      completePendingBackupImport(mode);
    } catch (e) {
      console.error("バックアップ反映失敗:", e);
      alert("バックアップを反映できませんでした。\n" + (e && e.message ? e.message : "端末の保存容量を確認してください。"));
    }
  };
  document.getElementById("backup-replace").addEventListener("click", () => runBackupImport("replace"));
  document.getElementById("backup-add").addEventListener("click", () => runBackupImport("add"));
  document.getElementById("backup-cancel").addEventListener("click", closeBackupActionDialog);
  document.getElementById("backup-action-overlay").addEventListener("click", (e) => {
    if (e.target.id === "backup-action-overlay") closeBackupActionDialog();
  });

  const layer = document.getElementById("selection-layer");
  layer.addEventListener("pointerdown", (e) => {
    selStart = { x: e.clientX, y: e.clientY };
    const rect = document.getElementById("selection-rect");
    rect.style.display = "block";
    updateSelectionRect(selStart.x, selStart.y, selStart.x, selStart.y);
    try { layer.setPointerCapture(e.pointerId); } catch (err) {}
  });
  layer.addEventListener("pointermove", (e) => {
    if (!selStart) return;
    updateSelectionRect(selStart.x, selStart.y, e.clientX, e.clientY);
  });
  layer.addEventListener("pointerup", (e) => {
    if (!selStart) return;
    const start = selStart;
    const end = { x: e.clientX, y: e.clientY };
    selStart = null;
    document.getElementById("selection-rect").style.display = "none";
    finalizeSelection(start, end);
  });

  document.getElementById("sa-reset").addEventListener("click", () => {
    if (pendingSelection) {
      pendingSelection.forEach(resetMarkerToUnvisited);
      saveData();
    }
    closeSelectionActionDialog();
    exitSelectionMode();
  });
  document.getElementById("sa-export").addEventListener("click", async () => {
    const targets = pendingSelection ? [...pendingSelection] : [];
    if (targets.length === 0) {
      showToast("書き出すアイコンがありません");
      return;
    }
    try {
      const result = await exportBackup(targets, "selection");
      if (result === "cancelled") return;
      closeSelectionActionDialog();
      exitSelectionMode();
    } catch (e) {
      console.error("選択範囲のバックアップ書き出し失敗:", e);
      alert("選択範囲のバックアップを書き出せませんでした。");
    }
  });
  document.getElementById("sa-share-url").addEventListener("click", async () => {
    const targets = pendingSelection ? [...pendingSelection] : [];
    if (targets.length === 0) {
      showToast("送信するアイコンがありません");
      return;
    }
    try {
      const result = await shareImportUrl(targets, "selection");
      if (result === "cancelled") return;
      closeSelectionActionDialog();
      exitSelectionMode();
    } catch (e) {
      console.error("選択範囲の一時取り込みURL作成失敗:", e);
      alert("選択範囲の取り込みURLを作成できませんでした。\n" + (e && e.message ? e.message : "JSONファイルで書き出してください。"));
    }
  });
  document.getElementById("sa-delete").addEventListener("click", () => {
    if (pendingSelection) {
      pendingSelection.map(m => m.id).forEach(removeMarker);
    }
    closeSelectionActionDialog();
    exitSelectionMode();
  });
  document.getElementById("sa-cancel").addEventListener("click", () => {
    closeSelectionActionDialog();
    exitSelectionMode();
  });

  document.getElementById("modal-close").addEventListener("click", closeRoomModal);
  document.getElementById("room-modal-overlay").addEventListener("click", (e) => {
    if (e.target.id === "room-modal-overlay") closeRoomModal();
  });

  document.querySelectorAll("#room-modal .tool-btn[data-action]").forEach(btn => {
    btn.addEventListener("click", () => roomToolAction(btn.dataset.action));
  });

  processImportUrl();
  window.addEventListener("hashchange", processImportUrl);
}
document.addEventListener("DOMContentLoaded", setupUI);
</script>
